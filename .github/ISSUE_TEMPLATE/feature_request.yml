name: Feature request
description: Propose a focused improvement to the school website template
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user need or limitation does this address?
      placeholder: A school visitor needs...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected behaviour
      description: Describe what a user should be able to do.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Add testable checklist items for the coding agent.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Existing page or component
        - New public page
        - Accessibility or responsive behaviour
        - Content/configuration
        - Documentation or developer workflow
    validations:
      required: true
  - type: checkboxes
    id: safeguards
    attributes:
      label: Safeguards
      options:
        - label: This does not require student records or a database.
          required: true
        - label: Any school-specific facts will be provided and verified by the client.
          required: true
